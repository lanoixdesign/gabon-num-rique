<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&amp;display=swap');
      .gdw-text-gabon-white { font-family: 'Poppins', sans-serif; font-weight: 400; fill: #FFFFFF; font-size: 78px; letter-spacing: -0.5px; }
      .gdw-text-digital-white { font-family: 'Poppins', sans-serif; font-weight: 700; fill: #FFFFFF; font-size: 78px; letter-spacing: -0.5px; }
      .gdw-text-week-white { font-family: 'Poppins', sans-serif; font-weight: 300; fill: #FFFFFF; font-size: 78px; letter-spacing: -0.5px; }
    </style>
  </defs>

  <!-- Grille de carrés dégradés (Symbol) -->
  <g transform="translate(10, 15)">
    <!-- Row 1 (y: 0) -->
    <rect x="15" y="0" width="28" height="28" rx="2" fill="#79B222" />
    <rect x="58" y="5" width="22" height="22" rx="2" fill="#9CC51A" />
    <rect x="95" y="8" width="16" height="16" rx="2" fill="#FCD116" />

    <!-- Row 2 (y: 36) -->
    <rect x="13" y="36" width="31" height="31" rx="2" fill="#4B9A25" />
    <rect x="56" y="39" width="26" height="26" rx="2" fill="#79B222" />
    <rect x="94" y="42" width="20" height="20" rx="2" fill="#B3CB18" />
    <rect x="127" y="46" width="14" height="14" rx="2" fill="#FCD116" />

    <!-- Row 3 (y: 75) -->
    <rect x="10" y="75" width="35" height="35" rx="3" fill="#28872F" />
    <rect x="54" y="77" width="30" height="30" rx="2.5" fill="#58A224" />
    <rect x="92" y="80" width="24" height="24" rx="2" fill="#88BA1E" />
    <rect x="125" y="83" width="19" height="19" rx="2" fill="#C5D317" />
    <rect x="153" y="86" width="13" height="13" rx="1.5" fill="#FCD116" />

    <!-- Row 4 (y: 118) -->
    <rect x="6" y="118" width="41" height="41" rx="3.5" fill="#0C7537" />
    <rect x="53" y="121" width="34" height="34" rx="3" fill="#3A922A" />
    <rect x="91" y="124" width="28" height="28" rx="2.5" fill="#69AC21" />
    <rect x="124" y="127" width="22" height="22" rx="2" fill="#9DC61A" />
    <rect x="152" y="130" width="17" height="17" rx="1.5" fill="#D3D916" />

    <!-- Row 5 (y: 167) -->
    <rect x="0" y="167" width="48" height="48" rx="4" fill="#006E3E" />
    <rect x="52" y="171" width="39" height="39" rx="3.5" fill="#1E8033" />
    <rect x="90" y="174" width="33" height="33" rx="3" fill="#4B9B26" />
    <rect x="123" y="177" width="26" height="26" rx="2.5" fill="#7CB420" />
    <rect x="151" y="180" width="20" height="20" rx="2" fill="#AED019" />
  </g>

  <!-- Typography: Gabon Digital Week (White) -->
  <text x="225" y="115">
    <tspan class="gdw-text-gabon-white">Gabon </tspan>
    <tspan class="gdw-text-digital-white">Digital </tspan>
    <tspan class="gdw-text-week-white">Week</tspan>
  </text>

  <!-- Le filet tricolore: vert drapeau (#009E60), jaune drapeau (#FCD116), bleu drapeau (#3A75C4) -->
  <g transform="translate(225, 148)">
    <rect x="0" y="0" width="248" height="9" rx="4" fill="#009E60" />
    <rect x="254" y="0" width="248" height="9" rx="4" fill="#FCD116" />
    <rect x="508" y="0" width="250" height="9" rx="4" fill="#3A75C4" />
  </g>
</svg>
